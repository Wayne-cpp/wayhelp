[project]
name = "wayhelp"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.4",
  "langchain-core>=0.3",
  "langchain-openai>=0.3",
  "sqlalchemy>=2.0",
  "pymysql>=1.1",
  "cryptography>=43",
  "pymilvus[milvus-lite]>=3.0.1",
  "jieba>=0.42.1",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "httpx>=0.27",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
