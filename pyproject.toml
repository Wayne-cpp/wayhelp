[project]
name = "wayhelp"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.4",
  "langchain-core>=0.3",
  "langchain-openai>=0.3",
  "httpx>=0.27",
  "sqlalchemy>=2.0",
  "pymysql>=1.1",
  "cryptography>=43",
  "pymilvus[milvus-lite]>=3.0.1",
  "jieba>=0.42.1",
  "langgraph>=1.0.8,<2",
  "langgraph-checkpoint-sqlite>=3.1.1",
  "mcp>=1,<2",
  "langchain-mcp-adapters>=0.1,<1",
  "langfuse>=3.15.0,<4",  # ch09 可观测性;v3 末代 SDK(Context7 核实兼容 langchain-core v1),spec 冻结不进 v4
  "langchain>=1,<2",  # langfuse.langchain.CallbackHandler 模块级探测导入;v1 分支实际只用 langchain_core
]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
